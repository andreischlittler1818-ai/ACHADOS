database_name = "achados-oauth"
database_id = "SUBSTITUIR_PELO_DATABASE_ID"

[vars]
FRONTEND_ORIGIN = "https://andreischlittler1818-ai.github.io"
PUBLIC_BASE_URL = "https://SUBSTITUIR.workers.dev"
# Não adicione segredos aqui. Configure via wrangler secret put.
